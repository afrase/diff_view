name: side_by_side_diff
description: A fast side-by-side diff view for Flutter, like JetBrains IDEs' diff viewer, with curved ribbons, synced scrolling, word highlights, folding and line selection.
version: 0.1.0
repository: https://github.com/afrase/side_by_side_diff
topics: [diff, code, viewer, widget, desktop]

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0
